# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>
  timeout: 5000
  default_transaction_mode: immediate

development:
  primary:
    <<: *default
    database: storage/db/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: storage/db/test.sqlite3

performance:
  primary:
    <<: *default
    database: storage/db/performance.sqlite3
    # Widen the page cache and the checkpoint window.
    #
    # The key is `pragmas`, and it took a while to be. This block said
    # `variables` for its first three weeks, which is the MySQL and Postgres
    # convention: the SQLite adapter reads `pragmas` and silently ignores keys
    # it does not know, so nothing failed and nothing applied. Every "tuned"
    # measurement taken in that time was of stock SQLite settings.
    #
    # Rails' own defaults are journal_mode: wal, synchronous: normal and
    # cache_size 2000, so two of these only restate what was already true and
    # the third was being actively reset to the default on every connection.
    # They are written out anyway: this file is the record of what the
    # experiment set, and a reader should not have to know the adapter's
    # defaults to know what was asked for.
    #
    # busy_timeout is here for the same reason, and is also already covered:
    # `timeout: 5000` in the default block above becomes a busy handler on
    # every connection.
    pragmas:
      cache_size: -64000
      wal_autocheckpoint: 4000
      busy_timeout: 5000
      journal_mode: wal
      synchronous: normal
      temp_store: memory

production:
  primary:
    <<: *default
    database: storage/db/production.sqlite3
